<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/media/favicon-32.png?v=2" />
	<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/media/favicon-16.png?v=2" />
	<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/media/favicon-180.png?v=2" />
	<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico?v=2" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Griffy&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
		rel="stylesheet"
	/>
	<script src="https://unpkg.com/@phosphor-icons/web"></script>
	<style>
		@font-face {
			font-family: 'Phantom Sans';
			src:
				url('https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Regular.woff2') format('woff2'),
				url('https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Regular.woff') format('woff');
			font-weight: 400;
			font-style: normal;
			font-display: swap;
		}
		@font-face {
			font-family: 'Phantom Sans';
			src:
				url('https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Bold.woff2') format('woff2'),
				url('https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Bold.woff') format('woff');
			font-weight: 700;
			font-style: normal;
			font-display: swap;
		}
		@font-face {
			font-family: 'Phantom Sans';
			src:
				url('https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Italic.woff2') format('woff2'),
				url('https://assets.hackclub.com/fonts/Phantom_Sans_0.7/Italic.woff') format('woff');
			font-weight: 400;
			font-style: italic;
			font-display: swap;
		}
	</style>
	%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
